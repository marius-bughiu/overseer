name: Release

# Builds and publishes desktop installers when a version tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Overseer ${{ github.ref_name }}"
          releaseBody: |
            See the [CHANGELOG](https://github.com/marius-bughiu/overseer/blob/main/CHANGELOG.md) for the full list of changes.

            ## Downloads

            | Platform | File |
            | --- | --- |
            | Windows (x64) | `..._x64-setup.exe` (installer) or `..._x64_en-US.msi` |
            | macOS (Apple Silicon) | `..._aarch64.dmg` |
            | macOS (Intel) | `..._x64.dmg` |
            | Linux (x64) | `.AppImage`, `.deb` or `.rpm` |

            ## ⚠️ These builds are not code-signed

            Overseer doesn't have a code-signing certificate yet, so your OS will
            warn you the first time you open it.

            - **macOS** — right-click the app in `/Applications` → **Open** → **Open**,
              or run `xattr -dr com.apple.quarantine /Applications/Overseer.app`.
            - **Windows** — on the SmartScreen prompt, click **More info** → **Run anyway**.

            If you'd rather not trust an unsigned binary, you can
            [build from source](https://github.com/marius-bughiu/overseer#-build-from-source).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
